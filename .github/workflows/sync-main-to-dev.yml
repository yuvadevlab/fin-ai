name: 🔄 Sync main → dev

on:
  pull_request:
    branches:
      - main
    types:
      - closed

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    name: Create Reverse Sync PR
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest

    steps:
      - name: 📦 Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🔄 Fetch branches
        run: |
          git fetch origin main
          git fetch origin dev

      - name: 🔍 Check if dev is behind main
        id: check
        run: |
          COMMITS=$(git rev-list --count origin/dev..origin/main)

          echo "Commits ahead: $COMMITS"

          if [ "$COMMITS" -eq 0 ]; then
            echo "behind=false" >> "$GITHUB_OUTPUT"
          else
            echo "behind=true" >> "$GITHUB_OUTPUT"
          fi

      - name: 🚀 Create Reverse Sync PR
        if: steps.check.outputs.behind == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          base: dev
          branch: main
          title: "chore: sync main → dev"
          body: |
            ## 🔄 Automatic Reverse Sync

            This pull request was automatically created because changes were merged into **main**.

            It synchronizes those changes back into **dev**.

            ### Checklist

            - [ ] Review merge conflicts (if any)
            - [ ] Ensure CI passes
            - [ ] Merge into dev
