name: 🔄 Sync main → dev

on:
  pull_request:
    branches:
      - main
    types:
      - closed

permissions:
  contents: read
  pull-requests: write

jobs:
  sync:
    name: Create Reverse Sync PR
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest

    steps:
      - name: 📦 Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🔄 Fetch branches
        run: |
          git fetch origin main
          git fetch origin dev

      - name: 🔍 Check if dev is behind main
        id: check
        run: |
          COMMITS=$(git rev-list --count origin/dev..origin/main)

          echo "Commits ahead: $COMMITS"

          if [ "$COMMITS" -eq 0 ]; then
            echo "behind=false" >> "$GITHUB_OUTPUT"
          else
            echo "behind=true" >> "$GITHUB_OUTPUT"
          fi

      - name: 🚀 Create Reverse Sync PR
        if: steps.check.outputs.behind == 'true'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.BOT_TOKEN }}
          script: |
            const { owner, repo } = context.repo;

            // Check for an existing open PR from main -> dev
            const existing = await github.rest.pulls.list({
              owner,
              repo,
              state: 'open',
              base: 'dev',
              head: `${owner}:main`,
            });

            if (existing.data.length > 0) {
              core.info(`Reverse sync PR already exists: #${existing.data[0].number}`);
              return;
            }

            // Create the PR
            const pr = await github.rest.pulls.create({
              owner,
              repo,
              title: 'chore: sync main → dev',
              head: 'main',
              base: 'dev',
              body: [
                "## 🔄 Automatic Reverse Sync",
                "",
                "This pull request was automatically created because changes were merged into **main**.",
                "",
                "It synchronizes the latest changes from **main** back into **dev**.",
                "",
                "### Checklist",
                "",
                "- [ ] Review merge conflicts (if any)",
                "- [ ] Ensure CI passes",
                "- [ ] Merge into dev"
              ].join("\n")
            });

            core.info(`Created PR #${pr.data.number}`);
