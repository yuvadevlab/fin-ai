name: 🔄 Reverse Sync (main ➔ dev)

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  sync-main-to-dev:
    name: Fast-forward dev with main
    runs-on: ubuntu-latest

    steps:
      - name: 📦 Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.AUTO_PR_PAT || secrets.GITHUB_TOKEN }}

      - name: 🔄 Sync main into dev
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git fetch origin dev main

          BEHIND_COUNT=$(git rev-list --count origin/dev..origin/main)
          echo "Commits in main not in dev: $BEHIND_COUNT"

          if [ "$BEHIND_COUNT" -eq 0 ]; then
            echo "✅ dev is already up to date with main."
            exit 0
          fi

          echo "🚀 Fast-forwarding / syncing dev..."
          git checkout dev
          git merge origin/main --no-edit -m "chore(sync): merge main into dev [skip ci]"
          git push origin dev
          echo "🎉 Successfully synced dev with main!"
