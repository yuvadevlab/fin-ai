name: 🚀 Deploy FinAI API to Google Cloud Run

on:
  push:
    branches:
      - main
      - dev
    paths:
      - "apps/api/**"
      - "packages/**"
      - "Dockerfile.api"
      - "Dockerfile"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/deploy-api.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-api-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: ⚡ Pre-Flight Quality Gate
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (!contains(github.event.head_commit.message, 'sync/main-to-dev') &&
       !contains(github.event.head_commit.message, 'reverse merge main into dev') &&
       !contains(github.event.head_commit.message, 'chore(sync):'))
    uses: yuvadevlab/.github/.github/workflows/reusable-ci.yml@main
    with:
      node-version: "24"
      run-tests: true

  deploy-dev:
    name: 🚢 Deploy Development
    needs: [validate]
    if: github.ref == 'refs/heads/dev'
    uses: yuvadevlab/.github/.github/workflows/reusable-deploy-cloudrun.yml@main
    with:
      service-name: "finai-api-dev"
      dockerfile: "Dockerfile.api"
      port: 4001
      memory: "512Mi"
      cpu: "1"
      min-instances: 0
      max-instances: 2
      concurrency: 80
      cpu-boost: true
      env-vars: |
        NODE_ENV=development
        DATABASE_URL=${{ secrets.DATABASE_URL_DEV }}
        DEVLAB_PORTAL_API_URL=${{ secrets.DEVLAB_PORTAL_API_URL }}
        AI_PROVIDER=google-ai-studio
        AI_PROVIDER_AGENT=google-ai-studio
        AI_PROVIDER_CHAT=google-ai-studio
        GOOGLE_AI_STUDIO_API_KEY=${{ secrets.GOOGLE_AI_STUDIO_API_KEY }}
        GOOGLE_AI_STUDIO_BASE_URL=https://generativelanguage.googleapis.com
        GOOGLE_AI_STUDIO_API_PATH=/v1beta/openai/chat/completions
        GOOGLE_AI_STUDIO_MODEL=${{ secrets.GOOGLE_AI_STUDIO_MODEL || 'gemini-2.5-flash' }}
        WEB_URL=${{ vars.WEB_URL_DEV }}
        CORS_ALLOWED_ORIGINS=${{ vars.CORS_ALLOWED_ORIGINS_DEV }}
    secrets:
      WIF_PROVIDER: ${{ secrets.WIF_PROVIDER }}
      WIF_SERVICE_ACCOUNT: ${{ secrets.WIF_SERVICE_ACCOUNT }}

  deploy-prod:
    name: 🚀 Deploy Production
    needs: [validate]
    if: github.ref == 'refs/heads/main'
    uses: yuvadevlab/.github/.github/workflows/reusable-deploy-cloudrun.yml@main
    with:
      service-name: "finai-api"
      dockerfile: "Dockerfile.api"
      port: 4001
      memory: "512Mi"
      cpu: "1"
      min-instances: 1
      max-instances: 5
      concurrency: 80
      cpu-boost: true
      env-vars: |
        NODE_ENV=production
        DATABASE_URL=${{ secrets.DATABASE_URL_PROD }}
        DEVLAB_PORTAL_API_URL=${{ secrets.DEVLAB_PORTAL_API_URL }}
        AI_PROVIDER=google-ai-studio
        AI_PROVIDER_AGENT=google-ai-studio
        AI_PROVIDER_CHAT=google-ai-studio
        GOOGLE_AI_STUDIO_API_KEY=${{ secrets.GOOGLE_AI_STUDIO_API_KEY }}
        GOOGLE_AI_STUDIO_BASE_URL=https://generativelanguage.googleapis.com
        GOOGLE_AI_STUDIO_API_PATH=/v1beta/openai/chat/completions
        GOOGLE_AI_STUDIO_MODEL=${{ secrets.GOOGLE_AI_STUDIO_MODEL || 'gemini-2.5-flash' }}
        WEB_URL=${{ vars.WEB_URL_PROD }}
        CORS_ALLOWED_ORIGINS=${{ vars.CORS_ALLOWED_ORIGINS_PROD }}
    secrets:
      WIF_PROVIDER: ${{ secrets.WIF_PROVIDER }}
      WIF_SERVICE_ACCOUNT: ${{ secrets.WIF_SERVICE_ACCOUNT }}
