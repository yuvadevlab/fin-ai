name: Deploy FinAI API to Google Cloud Run
run-name: 🚀 Deploy API to ${{ github.ref_name == 'main' && 'PROD (finai-api)' || 'DEV (finai-api-dev)' }} [${{ github.ref_name }}] by @${{ github.actor }}

on:
  push:
    branches:
      - main
      - dev
    paths:
      - "apps/api/**"
      - "packages/**"
      - "Dockerfile.api"
      - "Dockerfile"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/deploy-api.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-api-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: ⚡ Pre-Flight Quality Gate
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (!contains(github.event.head_commit.message, 'sync/main-to-dev') &&
       !contains(github.event.head_commit.message, 'reverse merge') &&
       !contains(github.event.head_commit.message, 'merge main into dev') &&
       !contains(github.event.head_commit.message, 'Merge branch ''main'' into dev') &&
       !contains(github.event.head_commit.message, 'chore(sync)'))
    uses: yuvadevlab/.github/.github/workflows/reusable-ci.yml@main
    with:
      node-version: "24"
      run-tests: true

  deploy:
    name: 🚢 Deploy to ${{ github.ref == 'refs/heads/main' && 'Production (finai-api)' || 'Development (finai-api-dev)' }}
    needs: [validate]
    environment:
      name: ${{ github.ref == 'refs/heads/main' && 'production' || 'development' }}
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (!contains(github.event.head_commit.message, 'sync/main-to-dev') &&
       !contains(github.event.head_commit.message, 'reverse merge') &&
       !contains(github.event.head_commit.message, 'merge main into dev') &&
       !contains(github.event.head_commit.message, 'Merge branch ''main'' into dev') &&
       !contains(github.event.head_commit.message, 'chore(sync)'))
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud via WIF
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Google Artifact Registry
        run: |
          gcloud auth configure-docker asia-southeast1-docker.pkg.dev --quiet

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Determine Environment Variables
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            SERVICE_NAME="finai-api"
            ENV_NAME="production"
            MIN_INSTANCES="1"
            MAX_INSTANCES="5"
            DB_URL="${{ secrets.DATABASE_URL_PROD }}"
            WEB_URL="${{ vars.WEB_URL_PROD }}"
            CORS_ALLOWED_ORIGINS="${{ vars.CORS_ALLOWED_ORIGINS_PROD }}"
          else
            SERVICE_NAME="finai-api-dev"
            ENV_NAME="development"
            MIN_INSTANCES="0"
            MAX_INSTANCES="2"
            DB_URL="${{ secrets.DATABASE_URL_DEV }}"
            WEB_URL="${{ vars.WEB_URL_DEV }}"
            CORS_ALLOWED_ORIGINS="${{ vars.CORS_ALLOWED_ORIGINS_DEV }}"
          fi

          echo "SERVICE_NAME=${SERVICE_NAME}" >> "$GITHUB_ENV"
          echo "ENV_NAME=${ENV_NAME}" >> "$GITHUB_ENV"
          echo "MIN_INSTANCES=${MIN_INSTANCES}" >> "$GITHUB_ENV"
          echo "MAX_INSTANCES=${MAX_INSTANCES}" >> "$GITHUB_ENV"
          echo "DB_URL=${DB_URL}" >> "$GITHUB_ENV"
          echo "WEB_URL=${WEB_URL}" >> "$GITHUB_ENV"
          echo "CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS}" >> "$GITHUB_ENV"
          echo "IMAGE_TAG=asia-southeast1-docker.pkg.dev/project-cbe181a6-46e7-4c7c-8e8/cloud-run-source-deploy/${SERVICE_NAME}:${{ github.sha }}" >> "$GITHUB_ENV"

      - name: Build and Push Container with Buildx
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.api
          push: true
          tags: |
            ${{ env.IMAGE_TAG }}
            asia-southeast1-docker.pkg.dev/project-cbe181a6-46e7-4c7c-8e8/cloud-run-source-deploy/${{ env.SERVICE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy "${{ env.SERVICE_NAME }}" \
            --image "${{ env.IMAGE_TAG }}" \
            --region asia-southeast1 \
            --allow-unauthenticated \
            --port 4001 \
            --memory 512Mi \
            --cpu 1 \
            --cpu-boost \
            --min-instances "${{ env.MIN_INSTANCES }}" \
            --max-instances "${{ env.MAX_INSTANCES }}" \
            --cpu-throttling \
            --concurrency 80 \
            --set-env-vars "^;;^\
          NODE_ENV=${{ env.ENV_NAME }};;\
          DATABASE_URL=${{ env.DB_URL }};;\
          DEVLAB_PORTAL_API_URL=${{ secrets.DEVLAB_PORTAL_API_URL }};;\
          AI_PROVIDER=cline;;\
          AI_PROVIDER_AGENT=cline;;\
          AI_PROVIDER_CHAT=cline;;\
          CLINE_BASE_URL=https://api.cline.bot/api/v1;;\
          CLINE_API_PATH=/chat/completions;;\
          CLINE_API_KEY=${{ secrets.CLINE_API_KEY }};;\
          CLINE_AGENT_MODEL=nvidia/nemotron-3.5-super-vl:free;;\
          CLINE_CHAT_MODEL=upstage/solar-mini4;;\
          CLINE_MODEL=nvidia/nemotron-3.5-super-vl:free;;\
          GOOGLE_AI_STUDIO_API_KEY=${{ secrets.GOOGLE_AI_STUDIO_API_KEY }};;\
          GOOGLE_AI_STUDIO_BASE_URL=https://generativelanguage.googleapis.com;;\
          GOOGLE_AI_STUDIO_API_PATH=/v1beta/openai/chat/completions;;\
          GOOGLE_AI_STUDIO_MODEL=${{ secrets.GOOGLE_AI_STUDIO_MODEL || 'gemini-3.5-flash-lite' }};;\
          WEB_URL=${{ env.WEB_URL }};;\
          CORS_ALLOWED_ORIGINS=${{ env.CORS_ALLOWED_ORIGINS }}" \
            --set-labels "environment=${{ env.ENV_NAME }},managed-by=github-actions,tier=api,app=finai" \
            --quiet

      - name: 📋 Deployment Summary
        if: always()
        run: |
          echo "## 🚀 Deployment Report: ${{ env.ENV_NAME == 'production' && '🔴 PRODUCTION' || '🟡 DEVELOPMENT' }}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Parameter | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Target Environment** | \`${{ env.ENV_NAME }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Cloud Run Service** | \`${{ env.SERVICE_NAME }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **GCP Region** | \`asia-southeast1\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Target Branch** | \`${{ github.ref_name }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Git Commit** | [\`${{ github.sha }}\`](${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}) |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Container Image** | \`${{ env.IMAGE_TAG }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Triggered By** | @${{ github.actor }} |" >> "$GITHUB_STEP_SUMMARY"
