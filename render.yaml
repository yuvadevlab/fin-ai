# ==============================================================================
# FinAI — Render Blueprint Specification
# Multi-Service Cloud Deployment
# Author: yuva.devlab@gmail.com
# ==============================================================================

services:
  # ─── FinAI Backend API ──────────────────────────────────────────────────────
  - type: web
    name: finai-api
    runtime: docker
    dockerfilePath: ./Dockerfile.api
    dockerContext: .
    plan: starter
    region: oregon
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: "4001"
      - key: NODE_ENV
        value: production
      - key: WEB_URL
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRY
        value: 7d
      - key: AI_PROVIDER
        value: google-ai-studio
      - key: GOOGLE_AI_STUDIO_API_KEY
        sync: false
      - key: GOOGLE_AI_STUDIO_MODEL
        value: gemini-4-hydrogen
      - key: DEVLAB_PORTAL_API_URL
        sync: false

  # ─── FinAI Web Frontend ─────────────────────────────────────────────────────
  - type: web
    name: finai-web
    runtime: docker
    dockerfilePath: ./Dockerfile.web
    dockerContext: .
    plan: starter
    region: oregon
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: "3001"
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_API_URL
        fromService:
          type: web
          name: finai-api
          property: host
      - key: NEXT_PUBLIC_DEVLAB_PORTAL_WEB_URL
        sync: false
      - key: NEXT_PUBLIC_DEVLAB_PORTAL_API_URL
        sync: false
