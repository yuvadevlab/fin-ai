packages:
  - "apps/*"
  - "packages/*"

allowBuilds:
  "@nestjs/core": true
  "@prisma/engines": true
  "@swc/core": true
  core-js-pure: false
  esbuild: true
  prisma: true
  sharp: true
  unrs-resolver: true

minimumReleaseAgeExclude:
  - "@yuva-devlab/auth-server@0.3.0 || 1.0.0"
  - "@yuva-devlab/auth-client@0.2.0 || 0.3.0 || 1.0.0 || 1.0.1"
  - "@yuva-devlab/sdk@0.2.1 || 0.2.2"
  - "@yuva-devlab/ui@1.3.0 || 1.3.1 || 1.3.2 || 1.4.1"
  - "@yuva-devlab/logger@1.1.0 || 1.2.0"
  - "@yuva-devlab/tokens@1.1.0 || 1.1.1 || 1.3.0"
  - "@yuva-devlab/errors@0.2.0"
  - "@yuva-devlab/ai-client@0.2.0"
  - "@yuva-devlab/agent-core@0.2.0"
